spring:
  application:
    name: tic-nugu
  datasource:
    url: jdbc:postgresql://localhost:5432/biometrie
    username: postgres
    password: 'admin'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

#log app
logging:
  level:
    ROOT: INFO
    bf.mfptps.tic-nugu:
      - DEBUG
      - INFO


